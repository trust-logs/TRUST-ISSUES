<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NaijaPay Admin</title><style>body{font-family:system-ui;margin:0;background:#f6f8fb;color:#101828}.wrap{max-width:1000px;margin:auto;padding:40px 20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;border:1px solid #eaecf0;border-radius:16px;padding:24px}.num{font-size:32px;font-weight:800;margin-top:8px}button{padding:12px 16px;border:0;border-radius:8px;background:#08783e;color:#fff;cursor:pointer}input{padding:12px;border:1px solid #d0d5dd;border-radius:8px;width:300px;margin-right:8px}@media(max-width:700px){.cards{grid-template-columns:1fr}input{width:calc(100% - 20px);margin:8px 0}}</style></head><body><div class="wrap"><h1>NaijaPay Admin</h1><p>Operations dashboard</p><div><input id="token" placeholder="Paste admin JWT"><button onclick="load()">Load summary</button></div><div class="cards"><div class="card"><div>Users</div><div class="num" id="users">—</div></div><div class="card"><div>Transactions</div><div class="num" id="tx">—</div></div><div class="card"><div>Pending</div><div class="num" id="pending">—</div></div></div><p id="msg"></p></div><script>async function load(){const token=document.getElementById('token').value;try{const r=await fetch('http://localhost:4000/api/admin/summary',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw Error(d.error);users.textContent=d.users;tx.textContent=d.transactions;pending.textContent=d.pending;msg.textContent='Loaded successfully.'}catch(e){msg.textContent=e.message}}</script></body></html>
